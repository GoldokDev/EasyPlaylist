name: easyplaylist

services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easyplaylist}
      POSTGRES_USER: ${POSTGRES_USER:-easyplaylist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-easyplaylist}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-easyplaylist}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GUEST_COOKIE_SIGNING_KEY: ${GUEST_COOKIE_SIGNING_KEY:-local-development-signing-key-change-me}
      LOBBY_TTL_HOURS: ${LOBBY_TTL_HOURS:-24}
      LOBBY_EXPIRATION_SWEEP_INTERVAL_MS: ${LOBBY_EXPIRATION_SWEEP_INTERVAL_MS:-60000}
      LOBBY_EXPIRATION_BATCH_SIZE: ${LOBBY_EXPIRATION_BATCH_SIZE:-100}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_REGION_CODE: ${YOUTUBE_REGION_CODE:-FR}
      SECRETS_ACTIVE_KEY_VERSION: ${SECRETS_ACTIVE_KEY_VERSION:-1}
      SECRETS_ENCRYPTION_KEY_V1: ${SECRETS_ENCRYPTION_KEY_V1:-bG9jYWwtZGV2ZWxvcG1lbnQtZW5jcnlwdGlvbi1rZXk=}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - frontend
      - backend
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  frontend:
  backend:
    internal: true
